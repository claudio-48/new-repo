# deployment-clients.conf
# Configurazione multi-cliente per deployment
#
# Formato: CLIENT_ID|PROD_SERVER|PROD_USER|PROD_BASE|PROJECT
#
# CLIENT_ID:    Identificativo univoco cliente (es: acme, globex)
# PROD_SERVER:  Hostname o IP server 
# PROD_USER:    User SSH per accesso
# PROD_BASE:    Radice del percorso dei sorgenti (es. /data/app)
# PROJECT:      Nome del progetto CVS o Git (es. alter-4-0, iter, viae)
#
# Linee che iniziano con # sono commenti e vengono ignorate

# Esempio: Cliente prod su VM con CVS
Claudio|192.168.121.52|vagrant|/home/vagrant/sources|alter-4-0

# Esempio: Cliente prod su localhost con CVS
#Claudio|127.0.0.1|claudio|/var/www/sources|alter-4-0


